experiment_name: qwen3-6-35b-a3b-megatron-vlm-cp-sft
trial_name: trial0

seed: 1
enable_offload: false
total_train_epochs: 1
total_train_steps: 8
tokenizer_path: ${actor.path}

cluster:
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

scheduler:
  type: local

actor:
  backend: "megatron:(attn:d1p2t2c2|ffn:d1p2t1e4)"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen3.6-35B-A3B
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  mb_spec:
    n_mbs: 8
    max_tokens_per_mb: 2560
    packing_algorithm: ffd
  optimizer:
    type: adam_bf16
    lr: 1e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
  megatron:
    bridge_type: megatron-bridge
    enable_mtp: false
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      cpu: 4
      mem: 64
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars:
        PYTORCH_ALLOC_CONF: expandable_segments:True

train_dataset:
  batch_size: 8
  shuffle: false
  drop_last: true
  pin_memory: true
  num_workers: 0
  path: synthetic/qwen36-vlm-cp-consistency
  type: sft

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: null
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled
