experiment_name: agentick-policy-online
trial_name: trial1

seed: 1
enable_offload: false
total_train_epochs: 3
# Online mode counts completed trajectories, not dataset passes.
# 32 prompts x 3 passes x 4 candidates = 384 trajectories = 24 updates.
total_train_steps: 24
tokenizer_path: ${actor.path}

cluster:
  # Retained from the Geometry3K template: adjust to your cloud allocation.
  n_nodes: 1
  n_gpus_per_node: 8
  fileroot: /tmp/areal/experiments
  name_resolve:
    type: nfs
    nfs_record_root: /tmp/areal/name_resolve

scheduler:
  type: local

rollout:
  _version: v2
  admin_api_key: ${oc.env:AREAL_ROLLOUT_ADMIN_KEY}
  backend: "sglang:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  max_concurrent_rollouts: 4
  queue_size: null
  consumer_batch_size: ${train_dataset.batch_size}
  max_head_offpolicyness: 4
  # Derive a distinct request seed from each candidate's task ID and turn.
  # This controls sampling, not async task-to-weight-version reproducibility.
  deterministic_sampling: true
  enable_rollout_tracing: false
  scheduling_spec: ${actor.scheduling_spec}
  fileroot: ${cluster.fileroot}
  tokenizer_path: ${tokenizer_path}
  dump_to_file: true
  agent:
    mode: online
    tool_call_parser: qwen25
    reasoning_parser: ""
    chat_template_type: hf
    export_style: individual
    turn_discount: 1.0
    set_reward_finish_timeout: 0.0
    engine_max_tokens: ${gconfig.max_tokens}

gconfig:
  # Each HTTP session is one trajectory; candidate groups live in the client.
  n_samples: 1
  reward_normalization: false
  min_new_tokens: 0
  max_new_tokens: 2048
  max_tokens: 32768
  greedy: false
  temperature: 1.0

actor:
  _version: v2
  admin_api_key: ${oc.env:AREAL_ACTOR_ADMIN_KEY}
  backend: "megatron:d4p1t1"
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  path: Qwen/Qwen2.5-1.5B-Instruct
  init_from_scratch: false
  disable_dropout: true
  gradient_checkpointing: true
  dtype: bfloat16
  weight_update_mode: awex
  # AWEX exports BF16 model parameters; Megatron keeps FP32 optimizer masters.
  megatron:
    wrap_with_ddp: true
    ddp:
      grad_reduce_in_fp32: true
      use_distributed_optimizer: true
  mb_spec:
    # A complete prompt + completion must fit; previous code/feedback are inputs.
    max_tokens_per_mb: ${gconfig.max_tokens}
  optimizer:
    type: adam
    lr: 2e-6
    weight_decay: 0.01
    beta1: 0.9
    beta2: 0.999
    eps: 1e-8
    lr_scheduler_type: constant
    gradient_clipping: 1.0
    warmup_steps_proportion: 0.001
  eps_clip: 0.4
  temperature: ${gconfig.temperature}
  reward_scaling: 1.0
  # Client supplies group-relative advantages via the reward endpoint.
  reward_bias: 0.0
  # Finite for JSON transport, above any practical group-relative advantage.
  reward_clip: 1000000.0
  discount: 1.0
  gae_lambda: 1.0
  kl_ctl: 0.0
  ppo_n_minibatches: 1
  recompute_logprob: true
  use_decoupled_loss: true
  rejection_sampling:
    metric: ratio
    upper: 5.0
  reward_norm: null
  adv_norm: null
  max_new_tokens: ${gconfig.max_new_tokens}
  scheduling_spec:
    - task_type: worker
      port_count: 2
      gpu: 1
      mem: 32
      cmd: python3 -m areal.infra.rpc.rpc_server
      env_vars: {}

ref: null
critic: null

sglang:
  model_path: ${actor.path}
  random_seed: ${seed}
  # SGLang otherwise ignores request-level sampling seeds.
  enable_deterministic_inference: true
  skip_tokenizer_init: true
  dtype: ${actor.dtype}
  max_running_requests: 64
  context_length: ${gconfig.max_tokens}
  mem_fraction_static: 0.8
  enable_multimodal: false

train_dataset:
  # Only the batch size is used. The service does not read task data.
  # Default client: 4 prompts x 4 candidates per update.
  batch_size: 16
  path: "null"
  type: rl

valid_dataset: null

saver:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

recover:
  mode: disabled
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: 3600

evaluator:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  freq_epochs: 1
  freq_steps: null
  freq_secs: null

stats_logger:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  wandb:
    mode: disabled

perf_tracer:
  experiment_name: ${experiment_name}
  trial_name: ${trial_name}
  fileroot: ${cluster.fileroot}
  enabled: false
  session_tracer:
    enabled: false
